<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 489" width="1024" height="489" fill="none">
  <rect width="1024" height="489" rx="16" fill="#0b0615"/>
  
  <!-- Subtle Purple Grid background -->
  <defs>
    <pattern id="purple-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="489" fill="url(#purple-grid)"/>
  <circle cx="200" cy="150" r="180" fill="url(#purple-glow)" filter="blur(40px)"/>

  <!-- Left Side UI Content -->
  <g transform="translate(48, 50)">
    <!-- Release Pill -->
    <rect x="0" y="0" width="285" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#8b5cf6"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a78bfa">Modern Solution for Silver Businesses</text>

    <!-- Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Silver Touch : A digital</text>
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#a78bfa">silver Touch Solutions</text>

    <!-- Subtitle -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9ca3af">A digital platform that helps jewellers and silver refineries</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9ca3af">to manage their customers, products, and dynamic receipts.</text>

    <!-- Buttons -->
    <rect x="0" y="210" width="160" height="44" rx="22" fill="#7c3aed"/>
    <text x="32" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Try Live Demo →</text>

    <rect x="175" y="210" width="165" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="210" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">Book a Demo</text>

    <!-- Stats bottom bar -->
    <line x1="0" y1="290" x2="420" y2="290" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    
    <text x="0" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Refineries</text>
    <text x="0" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Refining Tests Calculator</text>

    <text x="160" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Ledger Engine</text>
    <text x="160" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Invoice Balance Tracker</text>

    <text x="310" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">QR Verify</text>
    <text x="310" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Anti-tamper Verification</text>
  </g>

  <!-- Right Side Mockup Window -->
  <g transform="translate(520, 40)">
    <!-- Outer Window Card -->
    <rect width="456" height="400" rx="16" fill="#130b24" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="24" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="120" y="14" width="220" height="20" rx="10" fill="#1d1136"/>
    <text x="135" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a78bfa" fill-opacity="0.7">silvertouch.allysoftsolutions.com</text>

    <rect x="360" y="14" width="80" height="20" rx="10" fill="#7c3aed" fill-opacity="0.2"/>
    <circle cx="372" cy="24" r="3" fill="#a78bfa"/>
    <text x="380" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#a78bfa">Demo Mode</text>

    <!-- Side Menu Tabs -->
    <g transform="translate(15, 60)">
      <!-- Tab Home -->
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#ffffff" fill-opacity="0.04"/>
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d1d5db">Home</text>
      
      <!-- Tab Customer -->
      <rect x="0" y="32" width="70" height="26" rx="6" fill="#ffffff" fill-opacity="0.04"/>
      <text x="10" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d1d5db">Customer</text>

      <!-- Tab Product -->
      <rect x="0" y="64" width="70" height="26" rx="6" fill="#ffffff" fill-opacity="0.04"/>
      <text x="10" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d1d5db">Product</text>

      <!-- Tab Report (Active) -->
      <rect x="0" y="96" width="70" height="26" rx="6" fill="#7c3aed" fill-opacity="0.4" stroke="#7c3aed" stroke-opacity="0.8" stroke-width="1"/>
      <text x="10" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#ffffff">Report</text>

      <!-- Tab Logout -->
      <rect x="0" y="128" width="70" height="26" rx="6" fill="#ffffff" fill-opacity="0.04"/>
      <text x="10" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#d1d5db">Logout</text>
    </g>

    <!-- Main Content Area: Refining Reports List -->
    <g transform="translate(100, 60)">
      <!-- Panel Header -->
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Pending Refinery Tests</text>
      <text x="240" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#a78bfa">Total: 5 Pending</text>

      <!-- Table Row 1 -->
      <rect x="10" y="32" width="220" height="52" rx="8" fill="#1b1031" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1"/>
      <text x="22" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Kadi BS-33</text>
      <text x="22" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#9ca3af">Refiner: Aniket</text>
      <text x="140" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">65 / 45 gr</text>
      <text x="140" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981" font-weight="600">Purity: 99.2%</text>

      <!-- Table Row 2 -->
      <rect x="10" y="94" width="220" height="52" rx="8" fill="#1b1031" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1"/>
      <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Kadi BS-20</text>
      <text x="22" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#9ca3af">Refiner: Aniket</text>
      <text x="140" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">25 / 88 gr</text>
      <text x="140" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981" font-weight="600">Purity: 98.5%</text>

      <!-- Table Row 3 -->
      <rect x="10" y="156" width="220" height="52" rx="8" fill="#1b1031" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1"/>
      <text x="22" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Kadi BS-99</text>
      <text x="22" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#9ca3af">Refiner: Jenil</text>
      <text x="140" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">85 / 55 gr</text>
      <text x="140" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981" font-weight="600">Purity: 99.4%</text>

      <!-- Table Row 4 -->
      <rect x="10" y="218" width="220" height="52" rx="8" fill="#1b1031" stroke="#8b5cf6" stroke-opacity="0.15" stroke-width="1"/>
      <text x="22" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Kadi BS-5</text>
      <text x="22" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#9ca3af">Refiner: Jenil</text>
      <text x="140" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a78bfa">98 / 70 gr</text>
      <text x="140" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#10b981" font-weight="600">Purity: 99.1%</text>

      <!-- Sidebar Invoice Details Panel (Right side of list) -->
      <g transform="translate(240, 32)">
        <rect width="90" height="238" rx="8" fill="#1d1136" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1"/>
        <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#ffffff">Invoice</text>
        <line x1="8" y1="28" x2="82" y2="28" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        
        <!-- Miniature bill items -->
        <text x="10" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#9ca3af">Pure Silver</text>
        <text x="60" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#ffffff">₹64.2k</text>

        <text x="10" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#9ca3af">Refining Fee</text>
        <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#ffffff">₹1.8k</text>

        <line x1="8" y1="68" x2="82" y2="68" stroke="#ffffff" stroke-dasharray="2,2" stroke-opacity="0.1" stroke-width="1"/>

        <!-- QR Code Placeholder -->
        <rect x="25" y="80" width="40" height="40" rx="3" fill="#ffffff"/>
        <!-- QR content points -->
        <rect x="29" y="84" width="10" height="10" fill="#130b24"/>
        <rect x="51" y="84" width="10" height="10" fill="#130b24"/>
        <rect x="29" y="106" width="10" height="10" fill="#130b24"/>
        <rect x="43" y="96" width="8" height="8" fill="#130b24"/>

        <!-- Balance display -->
        <rect x="8" y="132" width="74" height="26" rx="4" fill="#10b981" fill-opacity="0.15"/>
        <text x="14" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#10b981">PAID IN FULL</text>

        <!-- Print receipt button -->
        <rect x="8" y="168" width="74" height="24" rx="12" fill="#7c3aed"/>
        <text x="22" y="183" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#ffffff">Print Receipt</text>

        <rect x="8" y="198" width="74" height="24" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <text x="24" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#9ca3af">Share SMS</text>
      </g>
    </g>

    <!-- Indicators -->
    <circle cx="210" cy="320" r="2.5" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="220" cy="320" r="2.5" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="230" cy="320" r="2.5" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="240" cy="320" r="2.5" fill="#7c3aed"/>
    <circle cx="250" cy="320" r="2.5" fill="#ffffff" fill-opacity="0.3"/>
  </g>
</svg>
