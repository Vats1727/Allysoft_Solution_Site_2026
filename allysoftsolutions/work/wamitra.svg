<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 489" width="1024" height="489" fill="none">
  <rect width="1024" height="489" rx="16" fill="#06120e"/>
  
  <!-- Subtle Grid background -->
  <defs>
    <pattern id="grid-pattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="489" fill="url(#grid-pattern)"/>
  <circle cx="200" cy="150" r="180" fill="url(#green-glow)" filter="blur(40px)"/>

  <!-- Left Side UI Content -->
  <g transform="translate(48, 50)">
    <!-- Release Pill -->
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#10b981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#10b981">New Release V2.0 • REST Gateway Live</text>

    <!-- Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff">The Enterprise</text>
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#10b981">WhatsApp Gateway</text>

    <!-- Subtitle -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9ca3af">Connect multiple WhatsApp instances, blast bulk campaigns,</text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#9ca3af">schedule automated messaging, and integrate webhooks.</text>

    <!-- Buttons -->
    <rect x="0" y="210" width="160" height="44" rx="22" fill="#10b981"/>
    <text x="32" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Get Started Free →</text>

    <rect x="175" y="210" width="165" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="195" y="237" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e5e7eb">View API Docs</text>

    <!-- Stats bottom bar -->
    <line x1="0" y1="290" x2="420" y2="290" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    
    <text x="0" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">99.99%</text>
    <text x="0" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Uptime SLA</text>

    <text x="140" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Sub-second</text>
    <text x="140" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Message Delivery</text>

    <text x="290" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff">256-bit</text>
    <text x="290" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Encryption</text>
  </g>

  <!-- Right Side Mockup Window -->
  <g transform="translate(520, 40)">
    <!-- Outer Window Card -->
    <rect width="456" height="400" rx="16" fill="#0d1f19" stroke="#10b981" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="24" r="5" fill="#10b981"/>

    <rect x="320" y="14" width="120" height="20" rx="10" fill="#10b981" fill-opacity="0.15"/>
    <circle cx="332" cy="24" r="3" fill="#10b981"/>
    <text x="342" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981">Gateway Connected</text>

    <!-- Metric Card 1: Instances -->
    <rect x="20" y="54" width="195" height="90" rx="12" fill="#142c24" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <rect x="36" y="70" width="34" height="34" rx="8" fill="#10b981" fill-opacity="0.2"/>
    <!-- Phone icon -->
    <rect x="47" y="78" width="12" height="18" rx="2" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="82" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">12</text>
    <text x="82" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Active Instances</text>

    <!-- Metric Card 2: Messages -->
    <rect x="235" y="54" width="200" height="90" rx="12" fill="#142c24" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <rect x="251" y="70" width="34" height="34" rx="8" fill="#8b5cf6" fill-opacity="0.2"/>
    <!-- Send icon -->
    <path d="M 264 87 L 273 78 L 261 83 Z" fill="#a78bfa"/>
    <text x="297" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff">48.2k</text>
    <text x="297" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Messages Sent</text>

    <!-- Log Row 1 -->
    <rect x="20" y="160" width="415" height="48" rx="8" fill="#142c24" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="38" cy="184" r="8" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 34 184 L 37 187 L 43 181" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="56" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e5e7eb">Campaign #104 delivered to +91 90239...</text>
    <text x="375" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b7280">Just now</text>

    <!-- Log Row 2 -->
    <rect x="20" y="220" width="415" height="48" rx="8" fill="#142c24" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="38" cy="244" r="8" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 34 244 L 37 247 L 43 241" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="56" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e5e7eb">Auto-reply triggered for keyword "PRICE"</text>
    <text x="375" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b7280">2m ago</text>

    <!-- Log Row 3 -->
    <rect x="20" y="280" width="415" height="48" rx="8" fill="#142c24" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="38" cy="304" r="8" fill="#10b981" fill-opacity="0.2"/>
    <path d="M 34 304 L 37 307 L 43 301" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="56" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e5e7eb">Instance "Sales-01" reconnected</text>
    <text x="375" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b7280">5m ago</text>
  </g>
</svg>
