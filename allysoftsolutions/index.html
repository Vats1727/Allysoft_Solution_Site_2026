<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const path = window.location.pathname;
        const virtualRoutes = ['/admin', '/login', '/forgot-password', '/recover-password'];
        let base = path;
        if (base.endsWith('/index.html')) {
          base = base.substring(0, base.length - 10);
        }
        for (const r of virtualRoutes) {
          const idx = base.indexOf(r);
          if (idx !== -1) {
            base = base.substring(0, idx);
            break;
          }
        }
        if (!base.endsWith('/')) {
          base = base + '/';
        }
        const baseTag = document.createElement('base');
        baseTag.href = base;
        document.head.insertBefore(baseTag, document.head.firstChild);

        // Inject dynamic path-resolved brand favicon logo
        const faviconLink = document.createElement('link');
        faviconLink.rel = 'icon';
        faviconLink.type = 'image/png';
        faviconLink.href = base + 'logo-white.png';
        document.head.appendChild(faviconLink);

        // Inject dynamic path-resolved SEO Canonical URL
        const canonicalLink = document.createElement('link');
        canonicalLink.rel = 'canonical';
        canonicalLink.href = window.location.origin + base;
        document.head.appendChild(canonicalLink);

        // Inject dynamic path-resolved OG Url meta tag
        const ogUrlMeta = document.createElement('meta');
        ogUrlMeta.setAttribute('property', 'og:url');
        ogUrlMeta.content = window.location.origin + base;
        document.head.appendChild(ogUrlMeta);

        // Inject dynamic path-resolved Twitter Url meta tag
        const twitterUrlMeta = document.createElement('meta');
        twitterUrlMeta.setAttribute('name', 'twitter:url');
        twitterUrlMeta.content = window.location.origin + base;
        document.head.appendChild(twitterUrlMeta);
      })();
    </script>
